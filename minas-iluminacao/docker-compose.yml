services:
  mysql:
    image: mysql:8.0
    container_name: minas-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: minas
      MYSQL_USER: minas
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-minas123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      TZ: America/Sao_Paulo
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: minas-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: minas
      DB_USER: minas
      DB_PASSWORD: ${MYSQL_PASSWORD:-minas123}
      JWT_SECRET: ${JWT_SECRET:-troque-esta-chave-em-producao-minimo-32-caracteres-0123456789}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      IOT_API_KEY: ${IOT_API_KEY:-dev-iot-key}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8081}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    container_name: minas-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  mysql_data:
